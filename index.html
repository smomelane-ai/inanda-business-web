<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inanda Business Web</title>
<meta name="theme-color" content="#12352b">
<meta name="description" content="Inanda Business Web - Kubamba ezingelayo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inanda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2ee;--surface:#fff;--ink:#12352b;--muted:#5b6f66;--line:#d3ddd6;--accent:#f2b705;--on-accent:#12352b;--bad:#b3261e;--bad-bg:#fbe9e7;--ok:#1b7a4b;--ok-bg:#e3f4ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a15;--surface:#16261f;--ink:#eaf2ed;--muted:#9bb0a5;--line:#2a3f35;--bad:#ff8a80;--bad-bg:#3a1f1c;--ok:#6fdc9d;--ok-bg:#173a28}}
:root[data-theme="dark"]{--bg:#0e1a15;--surface:#16261f;--ink:#eaf2ed;--muted:#9bb0a5;--line:#2a3f35;--bad:#ff8a80;--bad-bg:#3a1f1c;--ok:#6fdc9d;--ok-bg:#173a28}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;font:inherit;font-weight:600;font-size:14px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.demo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-bottom:14px}
.demo button,.sm{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
h1{font-size:22px;font-weight:800;margin:0 0 2px}
h2{font-size:16px;font-weight:800;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-size:15px}
.row+.row{border-top:1px solid var(--line)}
.row b{font-weight:600}
.big{font-size:40px;font-weight:800;letter-spacing:-.02em}
.note{font-size:14px;color:var(--muted);background:var(--bg);border-radius:10px;padding:12px;margin-top:10px}
.btn{width:100%;font:inherit;font-weight:800;font-size:16px;border:0;border-radius:12px;padding:14px;background:var(--accent);color:var(--on-accent);cursor:pointer;margin-top:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.banner{border-radius:12px;padding:14px;margin-bottom:14px;font-size:15px}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner strong{display:block;font-size:16px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:18px;cursor:pointer}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--muted)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
input[type=number],input[type=text],select{font:inherit;font-size:15px;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:90px}
select{width:100%;margin:6px 0}
.ref{font-weight:800;letter-spacing:.02em}
small{color:var(--muted)}
header{text-align:center;margin:6px 0 14px}
.brand{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.zu{font-size:12px;font-style:italic;color:var(--muted);margin-top:4px;letter-spacing:.04em}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;margin-bottom:12px}
.bar:empty{display:none}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;font:inherit;font-weight:600;font-size:14px;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=password],input[type=email],input[type=tel]{width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.areas button{font:inherit;font-weight:600;font-size:15px;padding:18px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.areas button:hover{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
</style>
</head>
<body>
<main>
  <header><div class="brand">Inanda Business Web</div><div class="zu">Kubamba ezingelayo</div></header>
  <div class="bar" id="bar"></div>
  <div id="install"></div>
  <div id="app"></div>
  <div id="logo" style="text-align:center;margin:20px auto 8px;max-width:220px"></div>
</main>
<script>
const R = c => "R" + (c/100).toFixed(2);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tab="cust", ownView="due", cancelling=null, user=null, loc=null, locId=null;
const ROLES={cust:"Customer",own:"Shop owner",adm:"Admin",drv:"Driver"};
let cview="food";
const blank=()=>({areas:[],shops:[],shop:null,menu:[],cart:{},address:"",orders:[],due:{},stmt:[],mine:[],all:[],err:"",note:"",drivers:[],trips:[],me:null,myPrices:[],jobs:[],dDue:{},pend:[],pays:[],xtrips:[],form:{},req:null});
let ST=blank();
const tagFor = st => ({placed:["New","bad"],accepted:["Accepted",""],delivered:["Delivered","ok"],cancelled:["Cancelled",""],requested:["Waiting for driver","bad"],started:["Trip started",""],declined:["Declined",""],completed:["Arrived safely","ok"]}[st]||[st,""]);
const rpc=(fn,args)=>sb("/rest/v1/rpc/"+fn,{method:"POST",body:JSON.stringify(args)});
async function go(fn){ ST.err=""; ST.note=""; try{await fn();}catch(e){ST.err=e.message;} render(); }
const msgs=()=>(ST.err?`<div class="banner bad">${esc(ST.err)}</div>`:"")+(ST.note?`<div class="banner ok">${esc(ST.note)}</div>`:"");

// ---- loading real data from the database ----
async function loadAreas(){ ST.areas=await sb("/rest/v1/areas?select=id,name&order=id"); }
async function loadCust(){
  ST.shops=locId?await sb(`/rest/v1/shops?select=id,name&area_id=eq.${locId}&order=id`):[];
  ST.mine=await sb(`/rest/v1/orders?select=id,status,cash_cents&customer_id=eq.${sess.user.id}&order=id.desc&limit=8`);
  await loadTrips();
}
async function loadMenu(shop){
  ST.shop=shop; ST.cart={};
  ST.menu=await sb(`/rest/v1/menu_items?select=id,name,app_price_cents&shop_id=eq.${shop.id}&is_available=eq.true&order=id`);
}
async function loadOwner(){
  const sh=await sb(`/rest/v1/shops?select=id,name,status&owner_id=eq.${sess.user.id}&limit=1`);
  ST.shop=sh[0]||null; if(!ST.shop){ST.orders=[];ST.menu=[];ST.due={};ST.stmt=[];return;}
  const id=ST.shop.id, base=`/rest/v1/orders?shop_id=eq.${id}`;
  const r=await Promise.all([
    sb(base+"&select=id,status,cash_cents,shop_cents,delivery_address,order_items(name,quantity)&status=in.(placed,accepted)&order=id"),
    sb(`/rest/v1/menu_items?select=id,name,shop_price_cents,app_price_cents&shop_id=eq.${id}&order=id`),
    sb(`/rest/v1/shop_amount_due?select=*&shop_id=eq.${id}`),
    sb(base+"&select=id,cash_cents,fee_cents,credit_cents,net_due_cents&status=eq.delivered&payment_id=is.null&order=id")]);
  ST.orders=r[0]; ST.menu=r[1]; ST.due=r[2][0]||{}; ST.stmt=r[3];
}
async function loadAdmin(){
  const r=await Promise.all([sb("/rest/v1/shops?select=id,name,status&order=id"),sb("/rest/v1/shop_amount_due?select=*"),
    sb("/rest/v1/drivers?select=id,full_name,cellphone,vehicle_make,vehicle_colour,plate_number,driver_private(id_number)&status=eq.pending"),
    sb("/rest/v1/payments?select=id,payer_type,reference,amount_cents&status=eq.pending&order=id"),
    sb("/rest/v1/transport_requests?select=id,dropoff_place,price_cents,started_at&status=eq.started&order=id")]);
  ST.all=r[0].map(s=>({...s,...(r[1].find(d=>d.shop_id===s.id)||{})})); ST.pend=r[2]; ST.pays=r[3]; ST.xtrips=r[4];
}
async function loadMe(){ const m=await sb(`/rest/v1/drivers?select=*&id=eq.${sess.user.id}`); ST.me=m[0]||null; }
async function loadTrips(){
  ST.trips=await sb(`/rest/v1/transport_requests?select=id,status,goods_type,dropoff_place,price_cents,drivers(full_name,cellphone,plate_number,vehicle_make,vehicle_colour)&customer_id=eq.${sess.user.id}&order=id.desc&limit=10`);
}
async function signPhotos(list){
  const paths=list.map(d=>d.photo_path).filter(Boolean); if(!paths.length) return;
  const r=await sb("/storage/v1/object/sign/driver-photos",{method:"POST",body:JSON.stringify({expiresIn:3600,paths})}), m={};
  (r||[]).forEach(x=>{ if(x.signedURL) m[x.path]=SB_URL+"/storage/v1"+x.signedURL; });
  list.forEach(d=>{ d.photo=m[d.photo_path]||""; });
}
async function loadDrivers(){
  ST.drivers=await sb("/rest/v1/drivers?select=id,full_name,cellphone,vehicle_make,vehicle_colour,plate_number,vehicle_type,photo_path,driver_prices(place_name,price_cents)&status=eq.approved&order=full_name");
  await signPhotos(ST.drivers);
}
async function loadDriver(){
  const id=sess.user.id;
  const r=await Promise.all([sb(`/rest/v1/drivers?select=*&id=eq.${id}`),
    sb(`/rest/v1/driver_prices?select=id,place_name,price_cents&driver_id=eq.${id}&order=place_name`),
    sb(`/rest/v1/transport_requests?select=id,status,goods_type,description,pickup_text,dropoff_place,when_text,customer_phone,price_cents&driver_id=eq.${id}&status=in.(requested,accepted,started)&order=id`),
    sb(`/rest/v1/driver_amount_due?select=*&driver_id=eq.${id}`)]);
  ST.me=r[0][0]||null; ST.myPrices=r[1]; ST.jobs=r[2]; ST.dDue=r[3][0]||{};
}
async function shrink(file){
  try{ const bmp=await createImageBitmap(file), k=Math.min(1,1280/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.8)); return blob||file;
  }catch(e){ return file; }
}
async function upload(bucket,file,name){
  const body=await shrink(file), path=sess.user.id+"/"+name;
  const r=await fetch(`${SB_URL}/storage/v1/object/${bucket}/${path}`,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+sess.access_token,"x-upsert":"true","Content-Type":body.type||"image/jpeg"},body});
  if(!r.ok){ let m=""; try{ m=(await r.json()).message||""; }catch(e){}
    throw new Error("Could not upload the picture"+(m?": "+m:"")+" (code "+r.status+")"); }
  return path;
}
const reload=()=>user.tab==="own"?loadOwner():user.tab==="adm"?loadAdmin():user.tab==="drv"?loadDriver():Promise.all([loadCust(),cview==="drive"?loadDrivers():0]);

// ---- screens ----
function food(){
  const mine=ST.mine.map(o=>{const t=tagFor(o.status);return `<div class="row"><span>Order #${o.id} · ${R(o.cash_cents)}</span><span class="tag ${t[1]}">${t[0]}</span></div>`}).join("");
  const hist=mine?`<div class="card"><h2>Your orders</h2>${mine}</div>`:"";
  if(!ST.shop){
    const list=ST.shops.map(s=>`<div class="row"><b>${esc(s.name)}</b><button class="sm" data-a="shop" data-id="${s.id}">Order</button></div>`).join("");
    return `<h1>Shops in ${esc(loc)}</h1><p class="sub">You pay cash when your order arrives.</p>${msgs()}<div class="card">${list||"<small>No shops are open in this area right now.</small>"}</div>${hist}`;
  }
  const total=ST.menu.reduce((a,i)=>a+(ST.cart[i.id]||0)*i.app_price_cents,0);
  const items=ST.menu.map(i=>{const q=ST.cart[i.id]||0;return `<div class="row"><div><b>${esc(i.name)}</b><br><small>${R(i.app_price_cents)}</small></div><div class="qty"><button data-a="dec" data-id="${i.id}" aria-label="Remove one ${esc(i.name)}">−</button><span>${q}</span><button data-a="inc" data-id="${i.id}" aria-label="Add one ${esc(i.name)}">+</button></div></div>`}).join("");
  return `<h1>${esc(ST.shop.name)}</h1><p class="sub">Delivered in ${esc(loc)}. You pay cash when it arrives.</p>${msgs()}
  <div class="card">${items||"<small>No items on the menu yet.</small>"}
    <label for="addr">Delivery address</label>
    <input id="addr" type="text" style="width:100%" value="${esc(ST.address)}" data-a="addr" placeholder="House number and street">
    <div class="row"><b>Pay cash on delivery</b><b>${R(total)}</b></div>
    <button class="btn" data-a="order" ${total?"":"disabled"}>Place order</button>
    <button class="btn ghost" data-a="shops">Back to shops</button></div>${hist}`;
}
const fld=(k,l,ph="",t="text")=>`<label for="f_${k}">${l}</label><input id="f_${k}" type="${t}" style="width:100%" value="${esc(ST.form[k]||"")}" data-a="form" data-k="${k}" placeholder="${ph}">`;
const sel=(k,l,opts)=>`<label for="f_${k}">${l}</label><select id="f_${k}" data-a="form" data-k="${k}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${(ST.form[k]||opts[0][0])===v?"selected":""}>${esc(t)}</option>`).join("")}</select>`;
const GOODS=[["furniture","Furniture"],["livestock","Livestock"],["material","Material"],["goods","Other goods"]];
const person=d=>`<div style="display:flex;gap:12px;align-items:center">${d.photo?`<img src="${esc(d.photo)}" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover">`:'<div style="width:64px;height:64px;border-radius:50%;background:var(--bg)"></div>'}<div><b>${esc(d.full_name)}</b><br><small>${esc(d.vehicle_colour)} ${esc(d.vehicle_make)} · ${esc(d.plate_number)}<br>${esc(d.cellphone)}</small></div></div>`;
function customer(){
  const seg=`<div class="seg" role="tablist">${[["food","Order food"],["drive","Request a driver"]].map(([k,l])=>`<button role="tab" aria-checked="${cview===k}" data-a="cview" data-v="${k}">${l}</button>`).join("")}</div>`;
  if(cview==="apply") return seg+applyScreen();
  return seg+(cview==="drive"?driveTab():(loc?food():areaScreen()))+(ST.me?"":'<button class="sm" style="margin:2px 0 14px" data-a="cview" data-v="apply">Become a driver</button>');
}
function driveTab(){
  if(ST.req) return reqForm();
  const cards=ST.drivers.map(d=>`<div class="card">${person(d)}<div class="note">${(d.driver_prices||[]).map(p=>`${esc(p.place_name)}: <b>${R(p.price_cents)}</b>`).join("<br>")||"No prices yet"}</div><button class="btn" data-a="reqdriver" data-v="${d.id}">Request this driver</button></div>`).join("");
  const trips=ST.trips.map(t=>{const g=tagFor(t.status),d=t.drivers||{};
    const act=(t.status==="accepted"||t.status==="started")?`<button class="btn" data-a="arrived" data-id="${t.id}">I have arrived safely</button>`:"";
    const can=(t.status==="requested"||t.status==="accepted")?(cancelling===t.id?`<select id="why"><option>Changed my mind</option><option>Driver not answering</option><option>Found another driver</option></select><button class="btn ghost" data-a="docanceltrip" data-id="${t.id}">Confirm cancel</button>`:`<button class="btn ghost" data-a="canceltrip" data-id="${t.id}">Cancel</button>`):"";
    return `<div class="card"><div class="row"><b>${esc(t.dropoff_place)} · ${R(t.price_cents)}</b><span class="tag ${g[1]}">${g[0]}</span></div><small>${esc(t.goods_type)} · ${esc(d.full_name||"")} ${esc(d.cellphone||"")} · ${esc(d.vehicle_colour||"")} ${esc(d.vehicle_make||"")} ${esc(d.plate_number||"")}</small>${act}${can}</div>`}).join("");
  return `<h1>Request a driver</h1><p class="sub">Move furniture, livestock, material or goods. You pay the driver in cash. Tap <b>I have arrived safely</b> when you get home.</p>${msgs()}${cards||'<div class="card"><small>No drivers are available right now.</small></div>'}${trips?`<h2>Your trips</h2>${trips}`:""}`;
}
function reqForm(){
  const d=ST.drivers.find(x=>x.id===ST.req);
  return `<h1>Request ${esc(d.full_name)}</h1>${msgs()}<div class="card">${person(d)}
  ${sel("place","Take my goods to",(d.driver_prices||[]).map(p=>[p.place_name,p.place_name+" — "+R(p.price_cents)]))}
  ${sel("goods","What are we moving?",GOODS)}${fld("desc","Short description","e.g. 2-seater couch and a fridge")}${fld("pickup","Pick-up address","House number and street")}
  ${fld("when","When?","e.g. Saturday morning")}${fld("phone","Your cellphone number","So the driver can call you","tel")}
  <button class="btn" data-a="sendreq">Send request</button><button class="btn ghost" data-a="noreq">Back</button></div>`;
}
function applyScreen(){
  const m=ST.me;
  if(m) return `<h1>Driver application</h1>${msgs()}<div class="card"><div class="banner ${m.status==="approved"?"ok":"bad"}"><strong>${m.status==="approved"?"You are approved":m.status==="suspended"?"Your account is suspended":"Waiting for approval"}</strong>${m.status==="approved"?"Log out and log in again to open your driver screen.":"We are checking your details. You will be able to see your driver screen once you are approved."}</div></div>`;
  return `<h1>Become a driver</h1><p class="sub">Customers will see your name, face photo, vehicle details and cellphone number. Your ID number stays hidden from customers.</p>${msgs()}<div class="card">
  ${fld("name","Full name")}${fld("phone","Cellphone number","","tel")}${fld("make","Vehicle make","e.g. Toyota Hilux")}${fld("colour","Vehicle colour")}${fld("plate","Number plate")}
  ${sel("vtype","Vehicle type",[["bakkie","Bakkie"],["car","Car"],["truck","Truck"],["other","Other"]])}${fld("idno","ID number")}
  <label for="f_photo">Your face photo</label><input id="f_photo" type="file" accept="image/*">
  <label for="f_idfile">Photo of your ID</label><input id="f_idfile" type="file" accept="image/*">
  <label style="display:flex;gap:8px;align-items:flex-start;margin-top:14px"><input id="f_consent" type="checkbox"><span>I agree that Inanda Business Web keeps my ID details to check who I am, and shows my name, photo, vehicle and cellphone number to customers.</span></label>
  <button class="btn" data-a="apply">Send application</button></div>`;
}
function driver(){
  if(ownView==="pay") return payScreen();
  const me=ST.me; if(!me) return applyScreen();
  const d=ST.dDue||{}, due=d.amount_due_cents||0;
  const bn=d.overdue?'<div class="banner bad"><strong>Payment overdue</strong>Customers cannot see you until you pay your balance.</div>':(me.status!=="approved"?'<div class="banner bad"><strong>Your account is not active</strong>Contact Inanda Business Web.</div>':"");
  const jobs=ST.jobs.map(j=>{const g=tagFor(j.status);let act="";
    if(j.status==="requested") act=cancelling===j.id?`<select id="why"><option>Too far</option><option>Vehicle too small</option><option>Not available that day</option></select><button class="btn ghost" data-a="dodecline" data-id="${j.id}">Confirm decline</button>`:`<button class="btn" data-a="jaccept" data-id="${j.id}">Accept</button><button class="btn ghost" data-a="decline" data-id="${j.id}">Decline</button>`;
    else if(j.status==="accepted") act=`<button class="btn" data-a="jstart" data-id="${j.id}">Start trip</button>`;
    else act='<div class="note">Trip started. It is finished when the customer taps that they have arrived.</div>';
    return `<div class="card"><div class="row"><b>${esc(j.dropoff_place)} · ${R(j.price_cents)}</b><span class="tag ${g[1]}">${g[0]}</span></div><p style="margin:4px 0">${esc(j.goods_type)}: ${esc(j.description||"")}</p><small>Pick up: ${esc(j.pickup_text)}<br>When: ${esc(j.when_text||"-")}<br>Customer: <a href="tel:${esc(j.customer_phone||"")}">${esc(j.customer_phone||"")}</a></small>${act}</div>`}).join("");
  const places=[...ST.areas.map(a=>[a.name,a.name]),["__other","Another place…"]];

    const pp=await upload("driver-photos",ph,"photo"), ip=await upload("driver-ids",idf,"id");
    await rpc("apply_as_driver",{p_name:f.name||"",p_phone:f.phone||"",p_make:f.make||"",p_colour:f.colour||"",p_plate:f.plate||"",p_type:f.vtype||"bakkie",p_id_number:f.idno||"",p_photo_path:pp,p_id_doc_path:ip});
    await loadMe(); ST.note="Application sent. We will check your details and approve you."; }),
  jaccept:(el,id)=>go(async()=>{await rpc("set_transport_status",{p_request:id,p_status:"accepted"});await loadDriver();}),
  jstart:(el,id)=>go(async()=>{await rpc("set_transport_status",{p_request:id,p_status:"started"});await loadDriver();}),
  decline:(el,id)=>{cancelling=id;},
  dodecline:(el,id)=>go(async()=>{await rpc("set_transport_status",{p_request:id,p_status:"declined",p_reason:document.getElementById("why").value});cancelling=null;await loadDriver();}),
  addprice:()=>go(async()=>{const f=ST.form; let place=f.pplace||(ST.areas[0]&&ST.areas[0].name); if(place==="__other") place=(f.pother||"").trim();
    const cents=Math.round(parseFloat(f.pprice)*100); if(!place||!(cents>0)) throw new Error("Choose a place and type a price.");
    const a=ST.areas.find(x=>x.name===place);
    await sb("/rest/v1/driver_prices?on_conflict=driver_id,place_name",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({driver_id:sess.user.id,place_name:place,area_id:a?a.id:null,price_cents:cents})});
    f.pprice=""; f.pother=""; await loadDriver(); ST.note="Price saved."; }),
  delprice:(el,id)=>go(async()=>{await sb("/rest/v1/driver_prices?id=eq."+id,{method:"DELETE",headers:{Prefer:"return=minimal"}});await loadDriver();}),
  approve:el=>go(async()=>{await rpc("approve_driver",{p_driver:el.dataset.v});await loadAdmin();}),
  payconfirm:(el,id)=>go(async()=>{await rpc("confirm_payment",{p_payment:id});await loadAdmin();}),
  payreject:(el,id)=>go(async()=>{await rpc("reject_payment",{p_payment:id});await loadAdmin();}),
  tripdone:(el,id)=>go(async()=>{await rpc("set_transport_status",{p_request:id,p_status:"completed"});await loadAdmin();}),
  pauseshop:(el,id)=>go(async()=>{await patchShop(id,{status:"paused",pause_reason:"unpaid"});await loadAdmin();}),
  openshop:(el,id)=>go(async()=>{await patchShop(id,{status:"open",pause_reason:null});await loadAdmin();})
};
document.body.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  const f=H[el.dataset.a]; if(!f) return;
  const r=f(el,+el.dataset.id); if(!(r instanceof Promise)) render();
});
document.body.addEventListener("change",e=>{
  const t=e.target, a=t.dataset.a;
  if(a==="bank"){ if(BANK){BANK[t.dataset.k]=t.value; saveBank(t.dataset.k,t.value);} }
  else if(a==="addr"){ ST.address=t.value; }
  else if(a==="form"){ ST.form[t.dataset.k]=t.value; if(t.dataset.k==="pplace") render(); }
  else if(a==="price"){ const v=Math.round(parseFloat(t.value)*100); if(v>0) go(async()=>{await sb("/rest/v1/menu_items?id=eq."+t.dataset.id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({shop_price_cents:v})});await loadOwner();}); }
});
document.getElementById("logo").innerHTML=LOGO; render(); restore();

// ---- PWA: install button and service worker ----
let deferred = null;
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
function installUI(){
  const el = document.getElementById("install");
  if(standalone) { el.innerHTML = ""; return; }
  if(deferred) el.innerHTML = '<div class="card"><b>Install Inanda Business Web</b><p class="sub" style="margin:4px 0 0">Add it to your phone or computer for quick access.</p><button class="btn" id="inst">Install app</button></div>';
  else if(isIOS) el.innerHTML = '<div class="note" style="margin:0 0 14px">To install: tap the Share button, then "Add to Home Screen".</div>';
  else el.innerHTML = "";
  const b = document.getElementById("inst");
  if(b) b.onclick = async () => { deferred.prompt(); await deferred.userChoice; deferred = null; installUI(); };
}
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; installUI(); });
addEventListener("appinstalled", () => { deferred = null; installUI(); });
installUI();
if("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
