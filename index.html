<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inanda Business Web</title>
<meta name="theme-color" content="#f3f3f1">
<meta name="description" content="Inanda Business Web - Kubamba ezingelayo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inanda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3f3f1;--surface:#fff;--ink:#111;--muted:#555;--line:#d4d4d0;--accent:#111;--on-accent:#fff;--bad:#b3261e;--bad-bg:#fdeceb;--ok:#14683d;--ok-bg:#e6f4ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;font:inherit;font-weight:600;font-size:14px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.demo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-bottom:14px}
.demo button,.sm{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
h1{font-size:22px;font-weight:800;margin:0 0 2px}
h2{font-size:16px;font-weight:800;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-size:15px}
.row+.row{border-top:1px solid var(--line)}
.row b{font-weight:600}
.big{font-size:40px;font-weight:800;letter-spacing:-.02em}
.note{font-size:14px;color:var(--muted);background:var(--bg);border-radius:10px;padding:12px;margin-top:10px}
.btn{width:100%;font:inherit;font-weight:800;font-size:16px;border:0;border-radius:12px;padding:14px;background:var(--accent);color:var(--on-accent);cursor:pointer;margin-top:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.banner{border-radius:12px;padding:14px;margin-bottom:14px;font-size:15px}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner strong{display:block;font-size:16px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:18px;cursor:pointer}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--muted)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
input[type=number],input[type=text],select{font:inherit;font-size:15px;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:90px}
select{width:100%;margin:6px 0}
.ref{font-weight:800;letter-spacing:.02em}
small{color:var(--muted)}
header{text-align:center;margin:6px 0 14px}
.brand{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.zu{font-size:12px;font-style:italic;color:var(--muted);margin-top:4px;letter-spacing:.04em}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;margin-bottom:12px}
.bar:empty{display:none}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;font:inherit;font-weight:600;font-size:14px;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=password],input[type=email],input[type=tel]{width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.areas button{font:inherit;font-weight:600;font-size:15px;padding:18px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.areas button:hover{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:8px 2px}
.sec-h h2{margin:0}.muted{font-size:12px;color:var(--muted)}
.vbar{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 14px;margin:0 -2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.vbar::-webkit-scrollbar{display:none}
.vcard{position:relative;flex:0 0 150px;aspect-ratio:9/16;border-radius:18px;overflow:hidden;scroll-snap-align:start;background:linear-gradient(160deg,#111,#3a3a3a);cursor:pointer;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.22);transition:transform .2s}
.vcard:hover{transform:translateY(-2px)}
.vcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vposter{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vcard::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65),rgba(0,0,0,0) 55%);pointer-events:none}
.vplay{position:absolute;top:50%;left:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.92);color:#111;display:grid;place-items:center;z-index:2;transition:transform .2s}
.vcard:hover .vplay{transform:scale(1.1)}
.vtitle{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;font-weight:600;font-size:13px;line-height:1.25;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.vcard video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:3;background:#000}
.vcard.playing::after,.vcard.playing .vplay,.vcard.playing .vtitle{display:none}
.vcard.verr::before{content:"Connect to the internet to watch";position:absolute;left:10px;right:10px;bottom:44px;z-index:4;font-size:12px;background:rgba(0,0,0,.65);padding:6px 8px;border-radius:8px}
@media (min-width:520px){.vcard{flex-basis:170px}}
@media (prefers-reduced-motion:reduce){.vcard,.vplay{transition:none}}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.nimg{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--bg)}
.nbody{padding:14px 16px 4px}
.nmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.nlive{font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ok)}
.ncard h3{margin:0 0 6px;font-size:18px;line-height:1.25}
.ntext{margin:0;font-size:15px}
.ntext.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.nmore{font:inherit;font-size:13px;font-weight:600;background:none;border:0;color:var(--ink);padding:6px 0;cursor:pointer;text-decoration:underline}
.nfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line);margin-top:6px}
.nfoot a{font-size:13px;color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:13px;padding:5px 12px 5px 5px;border-radius:999px}
.bav{width:22px;height:22px;border-radius:50%;background:var(--on-accent);color:var(--accent);display:grid;place-items:center;font-size:12px}
.seg{flex-wrap:wrap}.seg button{flex:1 1 90px}
.chatlog{max-height:55vh;min-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;font-size:15px;line-height:1.35;word-wrap:break-word;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.bt{display:block;font-size:11px;opacity:.65;margin-top:2px;text-align:right}
.chatbar{display:flex;gap:8px;margin-top:10px}
.chatbar input{flex:1;width:auto;font:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.chatrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.chatmeta{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.dot{display:inline-block;margin-left:6px;min-width:20px;padding:2px 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:800;text-align:center}
details.privnote{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
details.privnote summary{cursor:pointer;font-weight:600}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:14px;color:var(--ink);font-size:14px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 20px}
.cat{font:inherit;font-weight:800;font-size:19px;min-height:112px;padding:16px 8px;border-radius:16px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.cat .ci{font-size:36px;line-height:1}
.cat:active{transform:scale(.98)}
</style>
</head>
<body>
<main>
  <header><div class="brand">Inanda Business Web</div><div class="zu">Kubamba ezingelayo</div></header>
  <div class="bar" id="bar"></div>
  <div id="install"></div>
  <div id="app"></div>
  <div id="logo" style="text-align:center;margin:20px auto 8px;max-width:220px"></div>
</main>
<script>
const R = c => "R" + (c/100).toFixed(2);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tab="cust", ownView="due", cancelling=null, user=null, loc=null, locId=null;
const ROLES={cust:"Customer",own:"Shop owner",adm:"Admin",drv:"Driver"};
let cview="home", xtab="main";
const blank=()=>({areas:[],shops:[],shop:null,menu:[],cart:{},address:"",orders:[],due:{},stmt:[],mine:[],all:[],err:"",note:"",offers:[],trips:[],me:null,myRoutes:[],openReqs:[],myOffers:[],contacts:{},jobs:[],dDue:{},pend:[],pays:[],xtrips:[],form:{nsrc:"Chris"},chats:[],thread:null,msgs:[],threadWith:null,unread:0,profile:{},req:false,news:[],vids:[],feedErr:""});
let ST=blank();
const tagFor = st => ({placed:["New","bad"],accepted:["Accepted",""],delivered:["Delivered","ok"],cancelled:["Cancelled",""],open:["Waiting for drivers","bad"],requested:["Waiting for driver","bad"],started:["Trip started",""],declined:["Declined",""],completed:["Arrived safely","ok"]}[st]||[st,""]);
const rpc=(fn,args)=>sb("/rest/v1/rpc/"+fn,{method:"POST",body:JSON.stringify(args)});
async function go(fn){ ST.err=""; ST.note=""; try{await fn();}catch(e){ST.err=e.message;ST.note="";} render(); if(ST.err||ST.note) window.scrollTo({top:0,behavior:"smooth"}); }
const msgs=()=>(ST.err?`<div class="banner bad">${esc(ST.err)}</div>`:"")+(ST.note?`<div class="banner ok">${esc(ST.note)}</div>`:"");

// ---- loading real data from the database ----
async function loadAreas(){ ST.areas=await sb("/rest/v1/areas?select=id,name&order=id"); }
async function loadCust(){
  ST.shops=[];
  if(locId){
    try{ ST.shops=await sb(`/rest/v1/shops?select=id,name,owner_id,category&area_id=eq.${locId}&order=id`); }
    catch(e){ ST.shops=(await sb(`/rest/v1/shops?select=id,name,owner_id&area_id=eq.${locId}&order=id`)).map(x=>({...x,category:"food"})); }
  }
  ST.mine=await sb(`/rest/v1/orders?select=id,status,cash_cents&customer_id=eq.${sess.user.id}&order=id.desc&limit=8`);
  await loadTrips();
}
async function loadMenu(shop){
  ST.shop=shop; ST.cart={};
  ST.menu=await sb(`/rest/v1/menu_items?select=id,name,app_price_cents&shop_id=eq.${shop.id}&is_available=eq.true&order=id`);
}
async function loadOwner(){
  const sh=await sb(`/rest/v1/shops?select=id,name,status&owner_id=eq.${sess.user.id}&limit=1`);
  ST.shop=sh[0]||null; if(!ST.shop){ST.orders=[];ST.menu=[];ST.due={};ST.stmt=[];return;}
  const id=ST.shop.id, base=`/rest/v1/orders?shop_id=eq.${id}`;
  const r=await Promise.all([
    sb(base+"&select=id,status,cash_cents,shop_cents,delivery_address,customer_id,order_items(name,quantity)&status=in.(placed,accepted)&order=id"),
    sb(`/rest/v1/menu_items?select=id,name,shop_price_cents,app_price_cents&shop_id=eq.${id}&order=id`),
    sb(`/rest/v1/shop_amount_due?select=*&shop_id=eq.${id}`),
    sb(base+"&select=id,cash_cents,fee_cents,credit_cents,net_due_cents&status=eq.delivered&payment_id=is.null&order=id")]);
  ST.orders=r[0]; ST.menu=r[1]; ST.due=r[2][0]||{}; ST.stmt=r[3];
}
async function loadAdmin(){
  const r=await Promise.all([sb("/rest/v1/shops?select=id,name,status&order=id"),sb("/rest/v1/shop_amount_due?select=*"),
    sb("/rest/v1/drivers?select=id,full_name,cellphone,vehicle_make,vehicle_colour,plate_number,driver_private(id_number)&status=eq.pending"),
    sb("/rest/v1/payments?select=id,payer_type,reference,amount_cents&status=eq.pending&order=id"),
    sb("/rest/v1/transport_requests?select=id,from_place,to_place,price_cents,started_at&status=eq.started&order=id")]);
  ST.all=r[0].map(s=>({...s,...(r[1].find(d=>d.shop_id===s.id)||{})})); ST.pend=r[2]; ST.pays=r[3]; ST.xtrips=r[4];
}
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
const ago=iso=>{const m=Math.round((Date.now()-new Date(iso))/6e4); if(m<1)return "just now"; if(m<60)return m+" min ago"; const h=Math.round(m/60); if(h<24)return h+(h===1?" hour ago":" hours ago"); const d=Math.round(h/24); return d+(d===1?" day ago":" days ago");};
async function loadFeed(fresh){
  const o=fresh?{cache:"no-store"}:{};
  try{
    const r=await Promise.all([
      sb("/rest/v1/inanda_news?select=id,title,body,image_url,source_name,source_url,posted_at&is_published=eq.true&order=posted_at.desc&limit=6",o),
      sb("/rest/v1/funny_videos?select=id,title,video_url,poster_url,created_at&is_published=eq.true&order=created_at.desc&limit=12",o)]);
    ST.news=r[0]; ST.vids=r[1]; ST.feedErr="";
  }catch(e){ ST.feedErr=navigator.onLine===false?"offline":e.message; }
}
async function uploadMedia(file,folder){
  const isImg=/^image\//.test(file.type), body=isImg?await shrink(file):file;
  const path=`${folder}/${Date.now()}.${isImg?"jpg":(file.type==="video/webm"?"webm":"mp4")}`;
  const r=await fetch(`${SB_URL}/storage/v1/object/inanda-media/${path}`,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+sess.access_token,"Content-Type":body.type||file.type},body});
  if(!r.ok){ let m=""; try{m=(await r.json()).message||"";}catch(e){} throw new Error("Could not upload"+(m?": "+m:"")+" (code "+r.status+")"); }
  return `${SB_URL}/storage/v1/object/public/inanda-media/${path}`;
}
function grabFrame(src,local){
  return new Promise((resolve,reject)=>{
    const v=document.createElement("video"); v.muted=true; v.playsInline=true; v.preload=local?"auto":"metadata";
    if(!local) v.crossOrigin="anonymous";
    const end=(fn,x)=>{ clearTimeout(t); v.removeAttribute("src"); try{v.load();}catch(e){} fn(x); };
    const t=setTimeout(()=>end(reject,new Error("timeout")),20000);
    v.addEventListener("error",()=>end(reject,new Error("cannot read video")));
    v.addEventListener("loadedmetadata",()=>{ v.currentTime=Math.max(.3,Math.min(1.5,(v.duration||3)*.1)); });
    v.addEventListener("seeked",()=>{
      try{
        const k=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight)), c=document.createElement("canvas");
        c.width=Math.round(v.videoWidth*k); c.height=Math.round(v.videoHeight*k);
        c.getContext("2d").drawImage(v,0,0,c.width,c.height);
        c.toBlob(b=>b?end(resolve,b):end(reject,new Error("no frame")),"image/jpeg",.8);
      }catch(e){ end(reject,e); }
    },{once:true});
    v.src=src;
  });
}
async function makeThumb(src,local){          // best effort: a missing thumbnail never stops a post
  try{ const b=await grabFrame(src,local); return await uploadMedia(b,"thumbs"); }catch(e){ return null; }
}
async function loadChats(){ ST.chats=await rpc("my_chats",{}); ST.unread=ST.chats.reduce((a,c)=>a+(c.unread||0),0); }
async function loadThread(){ ST.msgs=ST.thread?await sb(`/rest/v1/chat_messages?select=id,sender_id,body,created_at&thread_id=eq.${ST.thread}&order=id.asc&limit=200`):[]; }
async function openChat(id){
  await loadChats(); ST.thread=id; ST.threadWith=ST.chats.find(c=>c.chat_id===id)||{}; await loadThread();
  if(user.tab==="cust") cview="msgs"; else xtab="msgs";
  rpc("mark_read",{p_thread:id}).then(loadChats).then(updateBadges).catch(()=>{});
  setTimeout(()=>{ const l=document.getElementById("chatlog"); if(l) l.scrollTop=l.scrollHeight; },0);
}
async function loadMe(){ const m=await sb(`/rest/v1/drivers?select=*&id=eq.${sess.user.id}`); ST.me=m[0]||null; }
async function loadTrips(){
  ST.trips=await sb(`/rest/v1/transport_requests?select=id,status,from_place,to_place,goods_type,budget_cents,price_cents&customer_id=eq.${sess.user.id}&order=id.desc&limit=10`);
  const ids=ST.trips.map(t=>t.id);
  ST.offers=ids.length?await sb(`/rest/v1/transport_offers?select=request_id,driver_id,price_cents,status,drivers(full_name,cellphone,vehicle_make,vehicle_colour,plate_number,photo_path)&request_id=in.(${ids.join(",")})&order=price_cents`):[];
  await signPhotos(ST.offers.map(o=>o.drivers).filter(Boolean));
}
async function signPhotos(list){
  const paths=list.map(d=>d.photo_path).filter(Boolean); if(!paths.length) return;
  const r=await sb("/storage/v1/object/sign/driver-photos",{method:"POST",body:JSON.stringify({expiresIn:3600,paths})}), m={};
  (r||[]).forEach(x=>{ if(x.signedURL) m[x.path]=SB_URL+"/storage/v1"+x.signedURL; });
  list.forEach(d=>{ d.photo=m[d.photo_path]||""; });
}
async function loadDriver(){
  const id=sess.user.id;
  const r=await Promise.all([sb(`/rest/v1/drivers?select=*&id=eq.${id}`),
    sb(`/rest/v1/driver_routes?select=id,from_place,to_place,price_cents&driver_id=eq.${id}&order=from_place`),
    sb(`/rest/v1/transport_requests?select=id,from_place,to_place,goods_type,description,when_text,budget_cents&status=eq.open&order=id`),
    sb(`/rest/v1/transport_offers?select=request_id,price_cents,status&driver_id=eq.${id}`),
    sb(`/rest/v1/transport_requests?select=id,status,from_place,to_place,goods_type,description,when_text,price_cents,customer_id&chosen_driver_id=eq.${id}&status=in.(accepted,started)&order=id`),
    sb(`/rest/v1/driver_amount_due?select=*&driver_id=eq.${id}`)]);
  ST.me=r[0][0]||null; ST.myRoutes=r[1]; ST.openReqs=r[2]; ST.myOffers=r[3]; ST.jobs=r[4]; ST.dDue=r[5][0]||{}; ST.contacts={};
  if(ST.jobs.length){ const c=await sb(`/rest/v1/transport_contacts?select=request_id,pickup_text,phone&request_id=in.(${ST.jobs.map(j=>j.id).join(",")})`); c.forEach(x=>{ST.contacts[x.request_id]=x;}); }
}
async function shrink(file){
  try{ const bmp=await createImageBitmap(file), k=Math.min(1,1280/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.8)); return blob||file;
  }catch(e){ return file; }
}
async function upload(bucket,file,name){
  const body=await shrink(file), path=sess.user.id+"/"+name;
  const r=await fetch(`${SB_URL}/storage/v1/object/${bucket}/${path}`,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+sess.access_token,"x-upsert":"true","Content-Type":body.type||"image/jpeg"},body});
  if(!r.ok){ let m=""; try{ m=(await r.json()).message||""; }catch(e){}
    throw new Error("Could not upload the picture"+(m?": "+m:"")+" (code "+r.status+")"); }
  return path;
}

  arrived:(el,id)=>go(async()=>{await rpc("set_transport_status",{p_request:id,p_status:"completed"});await loadTrips();ST.note="Thank you. We are glad you arrived safely.";}),
  canceltrip:(el,id)=>{cancelling=id;},
  docanceltrip:(el,id)=>go(async()=>{await rpc("set_transport_status",{p_request:id,p_status:"cancelled",p_reason:document.getElementById("why").value});cancelling=null;await loadTrips();}),
  apply:()=>go(async()=>{const f=ST.form;
    if(!document.getElementById("f_consent").checked) throw new Error("Please tick the box to agree.");
    const ph=document.getElementById("f_photo").files[0], idf=document.getElementById("f_idfile").files[0];
    if(!ph||!idf) throw new Error("Please add your face photo and a photo of your ID.");
    const pp=await upload("driver-photos",ph,"photo"), ip=await upload("driver-ids",idf,"id");
    await rpc("apply_as_driver",{p_name:f.name||"",p_phone:f.phone||"",p_make:f.make||"",p_colour:f.colour||"",p_plate:f.plate||"",p_type:f.vtype||"bakkie",p_id_number:f.idno||"",p_photo_path:pp,p_id_doc_path:ip});
    await loadMe(); ST.note="Application sent. We will check your details and approve you."; }),
  offer:(el,id)=>go(async()=>{await rpc("offer_transport",{p_request:id});await loadDriver();ST.note="Sent. The customer will choose a driver.";}),
  jstart:(el,id)=>go(async()=>{await rpc("set_transport_status",{p_request:id,p_status:"started"});await loadDriver();}),
  addroute:()=>go(async()=>{const f=ST.form, from=pl("rf"), to=pl("rt"), cents=Math.round(parseFloat(f.pprice)*100);
    if(!from||!to||same(from,to)) throw new Error("Choose two different places.");
    if(!(cents>0)) throw new Error("Type a price in rand.");
    const old=ST.myRoutes.find(x=>same(x.from_place,from)&&same(x.to_place,to));
    if(old) await sb("/rest/v1/driver_routes?id=eq."+old.id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({price_cents:cents})});
    else await sb("/rest/v1/driver_routes",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({driver_id:sess.user.id,from_place:from,to_place:to,price_cents:cents})});
    f.pprice=""; await loadDriver(); ST.note="Route price saved."; }),
  delroute:(el,id)=>go(async()=>{await sb("/rest/v1/driver_routes?id=eq."+id,{method:"DELETE",headers:{Prefer:"return=minimal"}});await loadDriver();}),
  xtab:el=>go(async()=>{xtab=el.dataset.v; ST.thread=null; ST.msgs=[]; if(xtab==="msgs") await loadChats();}),
  chatwith:el=>go(async()=>{ await openChat(await rpc("start_chat",{p_other:el.dataset.v})); }),
  support:()=>go(async()=>{ await openChat(await rpc("support_chat",{})); }),
  openchat:(el,id)=>go(()=>openChat(id)),
  closechat:()=>go(async()=>{ ST.thread=null; ST.msgs=[]; ST.threadWith=null; await loadChats(); }),
  send:async()=>{
    const i=document.getElementById("chatin"), t=i?i.value.trim():""; if(!t) return;
    try{ await rpc("send_message",{p_thread:ST.thread,p_body:t}); i.value=""; await loadThread();
      const l=document.getElementById("chatlog"); if(l){ l.innerHTML=logHtml(); l.scrollTop=l.scrollHeight; } loadChats().then(updateBadges).catch(()=>{}); }
    catch(e){ ST.err=e.message; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  },
  postnews:()=>go(async()=>{const f=ST.form;
    if(!(f.ntitle||"").trim()||!(f.nbody||"").trim()) throw new Error("Add a headline and the news text.");
    if(!(f.nsrc||"").trim()) throw new Error("Say who reported it, for example Chris.");
    let img=(f.nimg||"").trim(); const file=document.getElementById("n_file").files[0]; if(file) img=await uploadMedia(file,"news");
    await sb("/rest/v1/inanda_news",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({title:f.ntitle.trim(),body:f.nbody.trim(),image_url:img||null,source_name:f.nsrc.trim(),source_url:(f.nurl||"").trim()||null})});
    Object.assign(f,{ntitle:"",nbody:"",nimg:"",nurl:""}); await loadFeed(true); ST.note="News posted."; }),
  postvideo:()=>go(async()=>{const f=ST.form;
    if(!(f.vtitle||"").trim()) throw new Error("Add a title for the video.");
    let url=(f.vurl||"").trim(), poster=null; const file=document.getElementById("v_file").files[0];
    if(file){
      if(!/^video\/(mp4|webm)$/.test(file.type)) throw new Error("Please use an MP4 or WebM video. Other types, such as .mov or .mkv, will not work.");
      if(file.size>25*1024*1024) throw new Error("That video is "+Math.round(file.size/1048576)+" MB. The limit is 25 MB. Choose a shorter clip or compress it first.");
      ST.note="Uploading your video… please keep this page open."; render(); window.scrollTo({top:0});
      url=await uploadMedia(file,"videos"); ST.note="";
      try{ const obj=URL.createObjectURL(file); poster=await makeThumb(obj,true); URL.revokeObjectURL(obj); }catch(e){}
    }else if(url){ poster=await makeThumb(url,false); }
    if(!url) throw new Error("Paste a video link or choose a video file.");
    await sb("/rest/v1/funny_videos",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({title:f.vtitle.trim(),video_url:url,poster_url:poster})});
    Object.assign(f,{vtitle:"",vurl:""}); await loadFeed(true); ST.note="Video added."; }),
  thumbs:()=>go(async()=>{
    const todo=ST.vids.filter(v=>!v.poster_url); let ok=0;
    for(const v of todo){
      ST.note="Making thumbnails… "+ok+" of "+todo.length; render();
      const p=await makeThumb(v.video_url,false);
      if(p){ await sb("/rest/v1/funny_videos?id=eq."+v.id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({poster_url:p})}); ok++; }
    }
    await loadFeed(true);
    if(!ok) throw new Error("Could not read those videos here. Delete them and add them again with the Add video button.");
    ST.note=ok+(ok===1?" thumbnail":" thumbnails")+" created"+(ok<todo.length?", "+(todo.length-ok)+" could not be read.":".");
  }),
  delnews:(el,id)=>go(async()=>{await sb("/rest/v1/inanda_news?id=eq."+id,{method:"DELETE",headers:{Prefer:"return=minimal"}});await loadFeed(true);}),
  delvid:(el,id)=>go(async()=>{await sb("/rest/v1/funny_videos?id=eq."+id,{method:"DELETE",headers:{Prefer:"return=minimal"}});await loadFeed(true);}),
  approve:el=>go(async()=>{await rpc("approve_driver",{p_driver:el.dataset.v});await loadAdmin();}),
  payconfirm:(el,id)=>go(async()=>{await rpc("confirm_payment",{p_payment:id});await loadAdmin();}),
  payreject:(el,id)=>go(async()=>{await rpc("reject_payment",{p_payment:id});await loadAdmin();}),
  tripdone:(el,id)=>go(async()=>{await rpc("set_transport_status",{p_request:id,p_status:"completed"});await loadAdmin();}),
  pauseshop:(el,id)=>go(async()=>{await patchShop(id,{status:"paused",pause_reason:"unpaid"});await loadAdmin();}),
  openshop:(el,id)=>go(async()=>{await patchShop(id,{status:"open",pause_reason:null});await loadAdmin();})
};
document.body.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  const f=H[el.dataset.a]; if(!f) return;
  const r=f(el,+el.dataset.id); if(!(r instanceof Promise)) render();
});
document.body.addEventListener("change",e=>{
  const t=e.target, a=t.dataset.a;
  if(a==="bank"){ if(BANK){BANK[t.dataset.k]=t.value; saveBank(t.dataset.k,t.value);} }
  else if(a==="addr"){ ST.address=t.value; }
  else if(a==="chk"){ ST.form[t.dataset.k]=t.checked; }
  else if(a==="form"){ ST.form[t.dataset.k]=t.value; if(["rfrom","rto","rf","rt"].includes(t.dataset.k)) render(); }
  else if(a==="price"){ const v=Math.round(parseFloat(t.value)*100); if(v>0) go(async()=>{await sb("/rest/v1/menu_items?id=eq."+t.dataset.id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({shop_price_cents:v})});await loadOwner();}); }
});
function playCard(c){
  document.querySelectorAll(".vcard video").forEach(v=>v.pause());
  if(c.querySelector("video")||!c.dataset.src) return;
  const v=document.createElement("video"); v.src=c.dataset.src; v.controls=true; v.preload="auto"; v.setAttribute("playsinline","");
  v.addEventListener("error",()=>{c.classList.remove("playing"); c.classList.add("verr"); v.remove();});
  new IntersectionObserver(es=>es.forEach(en=>{ if(!en.isIntersecting) v.pause(); }),{threshold:.4}).observe(c);
  c.classList.add("playing"); c.classList.remove("verr"); c.appendChild(v); v.play().catch(()=>{});
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".vcard"); if(c&&!e.target.closest("video")) playCard(c);
  const b=e.target.closest(".nmore"); if(b){ const p=b.previousElementSibling, open=!p.classList.toggle("clamp"); b.textContent=open?"Show less":"Read more"; }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="chatin"){ e.preventDefault(); H.send(); return; } if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("vcard")){ e.preventDefault(); playCard(e.target); } });
if("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message",e=>{
  if(e.data&&e.data.type==="feed-updated"&&user&&!document.querySelector(".vcard.playing")) loadFeed().then(()=>{ if(user&&cview==="home"&&tab==="cust") render(); });
});
addEventListener("online",()=>{ if(user) go(reload); }); addEventListener("offline",()=>{ if(user) render(); });
loadAreas().then(()=>{ if(!user) render(); }).catch(()=>{});
let pollBusy=false, tick=0;
const inMsgs=()=>user&&(user.tab==="cust"?cview==="msgs":xtab==="msgs");
async function pollChat(){
  if(!user||!sess||document.visibilityState==="hidden"||pollBusy) return; pollBusy=true;
  try{
    const last=ST.msgs.length?ST.msgs[ST.msgs.length-1].id:0;
    await loadChats();
    if(ST.thread&&inMsgs()){ await loadThread(); const now=ST.msgs.length?ST.msgs[ST.msgs.length-1].id:0;
      if(now!==last){ const l=document.getElementById("chatlog"); if(l){ const near=l.scrollHeight-l.scrollTop-l.clientHeight<80; l.innerHTML=logHtml(); if(near) l.scrollTop=l.scrollHeight; } rpc("mark_read",{p_thread:ST.thread}).catch(()=>{}); } }
    else if(inMsgs()){ const c=document.getElementById("chatlist"); if(c) c.innerHTML=chatRows(); }
    updateBadges();
  }catch(e){}
  pollBusy=false;
}
setInterval(()=>{ tick++; if((ST.thread&&inMsgs())||tick%3===0) pollChat(); },10000);
document.getElementById("logo").innerHTML=LOGO; render(); restore();

// ---- PWA: install button and service worker ----
let deferred = null;
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
function installUI(){
  const el = document.getElementById("install");
  if(standalone) { el.innerHTML = ""; return; }
  if(deferred) el.innerHTML = '<div class="card"><b>Install Inanda Business Web</b><p class="sub" style="margin:4px 0 0">Add it to your phone or computer for quick access.</p><button class="btn" id="inst">Install app</button></div>';
  else if(isIOS) el.innerHTML = '<div class="note" style="margin:0 0 14px">To install: tap the Share button, then "Add to Home Screen".</div>';
  else el.innerHTML = "";
  const b = document.getElementById("inst");
  if(b) b.onclick = async () => { deferred.prompt(); await deferred.userChoice; deferred = null; installUI(); };
}
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; installUI(); });
addEventListener("appinstalled", () => { deferred = null; installUI(); });
installUI();
if("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
