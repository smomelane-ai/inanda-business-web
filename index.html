<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inanda Business Web</title>
<meta name="theme-color" content="#12352b">
<meta name="description" content="Inanda Business Web - Kubamba ezingelayo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inanda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2ee;--surface:#fff;--ink:#12352b;--muted:#5b6f66;--line:#d3ddd6;--accent:#f2b705;--on-accent:#12352b;--bad:#b3261e;--bad-bg:#fbe9e7;--ok:#1b7a4b;--ok-bg:#e3f4ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a15;--surface:#16261f;--ink:#eaf2ed;--muted:#9bb0a5;--line:#2a3f35;--bad:#ff8a80;--bad-bg:#3a1f1c;--ok:#6fdc9d;--ok-bg:#173a28}}
:root[data-theme="dark"]{--bg:#0e1a15;--surface:#16261f;--ink:#eaf2ed;--muted:#9bb0a5;--line:#2a3f35;--bad:#ff8a80;--bad-bg:#3a1f1c;--ok:#6fdc9d;--ok-bg:#173a28}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;font:inherit;font-weight:600;font-size:14px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.demo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-bottom:14px}
.demo button,.sm{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
h1{font-size:22px;font-weight:800;margin:0 0 2px}
h2{font-size:16px;font-weight:800;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-size:15px}
.row+.row{border-top:1px solid var(--line)}
.row b{font-weight:600}
.big{font-size:40px;font-weight:800;letter-spacing:-.02em}
.note{font-size:14px;color:var(--muted);background:var(--bg);border-radius:10px;padding:12px;margin-top:10px}
.btn{width:100%;font:inherit;font-weight:800;font-size:16px;border:0;border-radius:12px;padding:14px;background:var(--accent);color:var(--on-accent);cursor:pointer;margin-top:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.banner{border-radius:12px;padding:14px;margin-bottom:14px;font-size:15px}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner strong{display:block;font-size:16px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:18px;cursor:pointer}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--muted)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
input[type=number],input[type=text],select{font:inherit;font-size:15px;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:90px}
select{width:100%;margin:6px 0}
.ref{font-weight:800;letter-spacing:.02em}
small{color:var(--muted)}
header{text-align:center;margin:6px 0 14px}
.brand{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.zu{font-size:12px;font-style:italic;color:var(--muted);margin-top:4px;letter-spacing:.04em}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;margin-bottom:12px}
.bar:empty{display:none}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;font:inherit;font-weight:600;font-size:14px;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=password],input[type=email],input[type=tel]{width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.areas button{font:inherit;font-weight:600;font-size:15px;padding:18px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.areas button:hover{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
</style>
</head>
<body>
<main>
  <header><div class="brand">Inanda Business Web</div><div class="zu">Kubamba ezingelayo</div></header>
  <div class="bar" id="bar"></div>
  <div class="demo" id="demo" style="display:none"><span>Demo:</span>
    <button data-a="d2">Move to the 2nd</button>
    <button data-a="late">Move to the 4th</button>
    <button data-a="reset">Reset</button>
  </div>
  <div id="install"></div>
  <div id="app"></div>
  <div id="logo" style="text-align:center;margin:20px auto 8px;max-width:220px"></div>
</main>
<script>
const R = n => "R" + n.toFixed(2);
const FEE = 0.25, DEL = 0.05;
const online = s => Math.ceil(s / (1 - FEE) - 1e-9);
let S, tab = "cust", ownView = "due", cancelling = null, user = null, loc = null, loginRole = "cust";
const AREAS = ["White City","Congo","Geneva","Bhambayi","New Town C","Izimangweni","Ohlange","Dube Village"];
const ROLES = {cust:"Customer",own:"Shop owner",adm:"Admin"};

function init(){
  S = { paused:false, late:false, day:0,  nextId:1, cart:{}, pay:null, paidTotal:0, orders:[],
    items:[{id:1,name:"Chips",shop:15},{id:2,name:"Russian & chips",shop:25},{id:3,name:"Cold drink",shop:10}] };
  for(let i=0;i<12;i++) S.orders.push({id:S.nextId++,lines:[{n:"Chips",q:1,s:15,o:20}],status:"delivered",settled:false});
  tab=user?user.tab:"cust"; ownView="due"; cancelling=null;
}
const calc = o => { const on=o.lines.reduce((a,l)=>a+l.o*l.q,0), sh=o.lines.reduce((a,l)=>a+l.s*l.q,0);
  const fee=on-sh, cr=Math.round(on*DEL*100)/100; return {on,sh,fee,cr,net:fee-cr}; };
const unpaid = () => S.orders.filter(o=>o.status==="delivered"&&!o.settled);
const dueNow = () => unpaid().reduce((a,o)=>a+calc(o).net,0);
const sum = (arr,k) => arr.reduce((a,o)=>a+calc(o)[k],0);
const tagFor = st => ({placed:["New","bad"],accepted:["On its way",""],delivered:["Delivered","ok"],cancelled:["Cancelled",""]}[st]);

function customer(){
  const items = S.items.map(i=>{ const q=S.cart[i.id]||0; return `<div class="row"><div><b>${i.name}</b><br><small>${R(online(i.shop))}</small></div>
    <div class="qty"><button data-a="dec" data-id="${i.id}" aria-label="Remove one ${i.name}">−</button><span>${q}</span><button data-a="inc" data-id="${i.id}" aria-label="Add one ${i.name}">+</button></div></div>`; }).join("");
  const total = S.items.reduce((a,i)=>a+(S.cart[i.id]||0)*online(i.shop),0);
  const mine = S.orders.filter(o=>o.id>12).slice().reverse().map(o=>{const t=tagFor(o.status);return `<div class="row"><span>Order #${o.id} · ${R(calc(o).on)}</span><span class="tag ${t[1]}">${t[0]}</span></div>`}).join("");
  return `<h1>Mama's Chips</h1><p class="sub">Delivered in ${loc}. You pay cash when it arrives.</p>
  ${S.paused?'<div class="banner bad"><strong>Not taking orders right now</strong>Please try again later.</div>':''}
  <div class="card">${items}
    <div class="row"><b>Pay cash on delivery</b><b>${R(total)}</b></div>
    <button class="btn" data-a="order" ${S.paused||!total?"disabled":""}>Place order</button></div>
  ${mine?`<div class="card"><h2>Your orders</h2>${mine}</div>`:""}`;
}

function owner(){
  if(ownView==="pay") return payScreen();
  if(ownView==="stmt") return stmtScreen();
  const u = unpaid(), fee=sum(u,"fee"), cr=sum(u,"cr"), due=dueNow();
  const pend = S.pay;
  const bn = S.paused?'<div class="banner bad"><strong>Your shop is paused</strong>Customers can\'t order until the amount due is paid.</div>':(S.day>=1&&S.day<4&&dueNow()>0&&!S.pay?'<div class="banner bad"><strong>Pay by the 3rd</strong>After that your shop pauses and customers cannot order.</div>':'');
  const incoming = S.orders.filter(o=>o.status==="placed"||o.status==="accepted").map(o=>{
    const c=calc(o), t=tagFor(o.status), what=o.lines.map(l=>l.q+"× "+l.n).join(", ");
    let act="";
    if(cancelling===o.id) act=`<select id="why"><option>Customer not answering</option><option>Out of stock</option><option>Shop closed</option><option>Too far to deliver</option></select><button class="btn ghost" data-a="docancel" data-id="${o.id}">Confirm cancel</button>`;
    else if(o.status==="placed") act=`<button class="btn" data-a="accept" data-id="${o.id}">Accept order</button><button class="btn ghost" data-a="cancel" data-id="${o.id}">Cancel</button>`;
    else act=`<button class="btn" data-a="deliver" data-id="${o.id}">Delivered — cash collected</button><button class="btn ghost" data-a="cancel" data-id="${o.id}">Cancel</button>`;
    return `<div class="card"><div class="row"><b>Order #${o.id}</b><span class="tag ${t[1]}">${t[0]}</span></div><p style="margin:4px 0">${what}</p>
      <p class="note" style="margin:6px 0">Collect <b>${R(c.on)}</b> cash. You keep ${R(c.sh+c.cr)}. You owe ${R(c.net)}.</p>${act}</div>`; }).join("");
  const prices = S.items.map(i=>`<div class="row"><span>${i.name}</span><span>Shop <input type="number" min="1" step="1" value="${i.shop}" data-a="price" data-id="${i.id}" aria-label="Shop price for ${i.name}"> → app <b>${R(online(i.shop))}</b></span></div>`).join("");
  return `<h1>Amount due</h1><p class="sub">${S.day>=4?"It's the 4th. Payment was due on the 1st.":S.day>=1?"Payment was due on the 1st. Pay by the 3rd to keep your shop open.":"Pay on the 1st of every month."}</p>${bn}
  <div class="card">
    <div class="row"><span>Orders delivered</span><b>${u.length}</b></div>
    <div class="row"><span>Platform fee (25%)</span><b>${R(fee)}</b></div>
    <div class="row"><span>Delivery credit (5%)</span><b>−${R(cr)}</b></div>
    <div class="row"><span>Amount due</span><b class="big">${R(due)}</b></div>
    <div class="note">The 5% delivery credit (R1 on every R20 order) has been taken out, because you deliver the orders yourself.</div>
    ${pend?`<div class="banner ok" style="margin:10px 0 0"><strong>Payment submitted</strong>Waiting for us to confirm ${R(pend.amount)}.</div>`:`<button class="btn" data-a="pay" ${due?"":"disabled"}>Pay amount due</button>`}
  </div>
  <button class="btn ghost" data-a="stmt" style="margin:-4px 0 14px">View monthly statement</button><h2>Incoming orders</h2>${incoming||'<div class="card"><small>No open orders. New orders from customers show up here.</small></div>'}
  <h2>Your menu prices</h2><div class="card">${prices}<div class="note">Customers pay the app price in cash. You keep the shop price (plus the delivery credit).</div></div>`;
}

function stmtScreen(){
  const u=unpaid(), t=k=>R(sum(u,k));
  const rows=u.map(o=>{const c=calc(o);return `<tr><td>#${o.id}</td><td>${R(c.on)}</td><td>${R(c.fee)}</td><td>−${R(c.cr)}</td><td>${R(c.net)}</td></tr>`}).join("");
  return `<h1>Monthly statement</h1><p class="sub">Delivered orders 1–30 September, not yet paid.</p>
  <div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;text-align:right">
    <tr><th style="text-align:left">Order</th><th>Cash</th><th>Fee</th><th>Credit</th><th>You owe</th></tr>${rows}
    <tr><th style="text-align:left">Total</th><th>${t("on")}</th><th>${t("fee")}</th><th>−${t("cr")}</th><th>${t("net")}</th></tr></table>
    <div class="note">Fee is 25% of the app price. The delivery credit is 5% of the app price. You owe the fee minus the credit.</div>
    <button class="btn ghost" data-a="back">Back</button></div>`;
}

function payScreen(){
  const due=dueNow();
  if(!BANK) return '<h1>Pay by EFT</h1><p class="sub">Loading bank details…</p><button class="btn ghost" data-a="back">Back</button>';
  return `<h1>Pay by EFT</h1><p class="sub">Transfer the exact amount, using this reference.</p>
  <div class="card">
    <div class="row"><span>Amount</span><b>${R(due)}</b></div>
    <div class="row"><span>Account name</span><b>${BANK.name}</b></div>
    <div class="row"><span>Bank</span><b>${BANK.bank}</b></div>
    <div class="row"><span>Account number</span><b>${BANK.acct}</b></div>
    <div class="row"><span>Branch code</span><b>${BANK.branch}</b></div>
    <div class="row"><span>Reference</span><b class="ref">SHOP014-${S.late?"OCT":"SEP"}26</b></div>
    <div class="note">The reference tells us which shop paid. We'll reopen your shop as soon as we confirm the payment.</div>
    <button class="btn" data-a="paid">I've made the payment</button>
    <button class="btn ghost" data-a="back">Back</button></div>`;
}

function admin(){
  const p=S.pay, shops=unpaid().length;
  return `<h1>Admin</h1><p class="sub">Your side: confirm EFT payments and see your earnings.</p>
  <div class="card"><h2>Payments to confirm</h2>
    ${p?`<div class="row"><span>Shop 014 · ${p.ids.length} orders</span><b>${R(p.amount)}</b></div><div class="row"><span>Reference</span><b class="ref">SHOP014-${p.m}26</b></div>
      <div class="note">Check this amount and reference in your bank account before confirming.</div>
      <button class="btn" data-a="confirm">Confirm payment received</button>`:'<small>Nothing waiting.</small>'}
  </div>
  <div class="card"><h2>Your bank details</h2><small>Owners see these when they pay.</small>
    ${[["name","Account name"],["bank","Bank"],["acct","Account number"],["branch","Branch code"]].map(([k,l])=>`<div class="row"><span>${l}</span><input type="text" style="width:60%" value="${BANK?BANK[k]:""}" data-a="bank" data-k="${k}" aria-label="${l}"></div>`).join("")}</div>
  <div class="card"><h2>Your earnings</h2>
    <div class="row"><span>Received so far</span><b>${R(S.paidTotal)}</b></div>
    <div class="row"><span>Still owed by shop 014</span><b>${R(dueNow())}</b></div>
    <div class="row"><span>Cancelled orders</span><b>${S.orders.filter(o=>o.status==="cancelled").length} of ${S.orders.length}</b></div>
    <div class="note">Watch the cancelled count. An owner who cancels many orders may be avoiding the fee. Every cancellation records a reason.</div></div>`;
}

const LOGO = `<svg viewBox="0 0 260 226" role="img" aria-label="Inanda Business Web logo: a woman paying a man">
<circle cx="130" cy="102" r="94" fill="#f2b705"/><circle cx="130" cy="102" r="94" fill="none" stroke="#12352b" stroke-width="5"/>
<path d="M60 168h140" stroke="#12352b" stroke-width="4" stroke-linecap="round"/>
<g><path d="M63 80 Q85 20 107 80 Z" fill="#c0392b"/><circle cx="85" cy="64" r="16" fill="#8d5a3b"/><path d="M66 56 Q85 30 104 56 Q85 46 66 56Z" fill="#c0392b"/>
<path d="M60 150 L72 84 Q85 76 98 84 L110 150 Z" fill="#12352b"/><path d="M72 112 L98 112" stroke="#f2b705" stroke-width="3"/>
<rect x="72" y="150" width="9" height="18" fill="#8d5a3b"/><rect x="89" y="150" width="9" height="18" fill="#8d5a3b"/>
<path d="M98 96 L138 100" stroke="#8d5a3b" stroke-width="8" stroke-linecap="round"/></g>
<g><circle cx="177" cy="64" r="16" fill="#6b3f26"/><path d="M160 58 Q177 34 194 58 Z" fill="#1b7a4b"/><path d="M192 58 L206 60" stroke="#1b7a4b" stroke-width="5" stroke-linecap="round"/>
<path d="M155 150 L160 84 Q177 76 194 84 L199 150 Z" fill="#fff" stroke="#12352b" stroke-width="3"/>
<rect x="161" y="150" width="10" height="18" fill="#12352b"/><rect x="183" y="150" width="10" height="18" fill="#12352b"/>
<path d="M160 98 L148 104" stroke="#6b3f26" stroke-width="8" stroke-linecap="round"/></g>
<g transform="rotate(-8 148 98)"><rect x="134" y="90" width="28" height="15" rx="2" fill="#1b7a4b" stroke="#12352b" stroke-width="2"/>
<text x="148" y="102" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="sans-serif">R</text></g>
<g fill="#12352b"><path d="M148 66 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/><path d="M122 54 l2 4 4 2 -4 2 -2 4 -2 -4 -4 -2 4 -2z"/></g>
<text x="130" y="219" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="1.5" style="fill:var(--ink)" font-family="Bricolage Grotesque,system-ui,sans-serif">INANDA BUSINESS WEB</text></svg>`;

const SB_URL="https://zcqkydqrsriijjwaajjw.supabase.co", SB_KEY="sb_publishable_GE52i2wYNandjWq8rjpF4A_kbqIFraT";
let sess=null, BANK=null, authMsg="";
async function sb(path,opt={}){
  const r=await fetch(SB_URL+path,{...opt,headers:{apikey:SB_KEY,"Content-Type":"application/json",...(sess?{Authorization:"Bearer "+sess.access_token}:{}),...(opt.headers||{})}});
  const t=await r.text(); let j=null; try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok) throw new Error((j&&(j.msg||j.error_description||j.message))||"Something went wrong. Please try again.");
  return j;
}
async function afterLogin(s){
  sess=s; localStorage.setItem("inanda_sess",JSON.stringify(s));
  const p=await sb("/rest/v1/profiles?select=role&id=eq."+s.user.id);
  const role=(p&&p[0]&&p[0].role)||"customer";
  user={tab:{customer:"cust",owner:"own",admin:"adm"}[role]}; tab=user.tab; ownView="due"; loc=null; authMsg="";
  if(role!=="customer") loadBank();
}
async function loadBank(){
  try{const b=await sb("/rest/v1/bank_details?select=*&id=eq.1");
    if(b&&b[0]) BANK={name:b[0].account_name,bank:b[0].bank_name,acct:b[0].account_number,branch:b[0].branch_code||""};}catch(e){}
  render();
}
async function saveBank(k,v){
  const col={name:"account_name",bank:"bank_name",acct:"account_number",branch:"branch_code"}[k];
  try{await sb("/rest/v1/bank_details?id=eq.1",{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({[col]:v})});}
  catch(e){alert("Could not save: "+e.message);}
}
async function doLogin(){
  const email=document.getElementById("uid").value.trim(), password=document.getElementById("pw").value;
  try{ await afterLogin(await sb("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email,password})})); }
  catch(e){ authMsg=e.message; }
  render();
}
async function doSignup(){
  const email=document.getElementById("uid").value.trim(), password=document.getElementById("pw").value;
  try{ const r=await sb("/auth/v1/signup",{method:"POST",body:JSON.stringify({email,password})});
    if(r&&r.access_token) await afterLogin(r); else authMsg="Account created. Check your email to confirm it, then log in."; }
  catch(e){ authMsg=e.message; }
  render();
}
let authView="login", recoveryToken=null;
async function doRecover(){
  const email=document.getElementById("uid").value.trim();
  if(!email){authMsg="Type your email address first.";render();return;}
  try{ await sb("/auth/v1/recover?redirect_to="+encodeURIComponent(location.origin+location.pathname),{method:"POST",body:JSON.stringify({email})});
    authMsg="If that email has an account, we have sent a link to reset the password."; authView="login"; }
  catch(e){ authMsg=e.message; }
  render();
}
async function doSetPw(){
  const pw=document.getElementById("pw").value, pw2=document.getElementById("pw2").value;
  if(pw.length<6){authMsg="The password must be at least 6 characters.";render();return;}
  if(pw!==pw2){authMsg="The two passwords are not the same.";render();return;}
  try{ await sb("/auth/v1/user",{method:"PUT",headers:{Authorization:"Bearer "+recoveryToken},body:JSON.stringify({password:pw})});
    recoveryToken=null; authView="login"; authMsg="Password changed. Log in with your new password."; }
  catch(e){ authMsg=e.message; }
  render();
}
(function(){ // arriving from the reset email link
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("type")==="recovery"&&h.get("access_token")){ recoveryToken=h.get("access_token"); authView="reset"; history.replaceState(null,"",location.pathname); }
  else if(h.get("error_description")){ authMsg="That link has expired. Ask for a new reset link."; history.replaceState(null,"",location.pathname); }
})();
async function restore(){
  try{ const s=JSON.parse(localStorage.getItem("inanda_sess")||"null"); if(!s) return;
    await afterLogin(await sb("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:s.refresh_token})})); }
  catch(e){ localStorage.removeItem("inanda_sess"); }
  render();
}

function loginScreen(){
  return `<div class="card"><h2>Log in</h2>
  ${authMsg?`<div class="banner ${/^(Account created|Password changed|If that email)/.test(authMsg)?"ok":"bad"}">${authMsg}</div>`:""}
  <label for="uid">Email address</label>
  <input id="uid" type="email" autocomplete="username">
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password">
  <button class="btn" data-a="login">Log in</button>
  <button class="btn ghost" data-a="signup">Create a customer account</button>
  <button class="sm" style="margin-top:12px" data-a="forgot">Forgot password?</button>
  <div class="note">Shop owners and admin get their access from Inanda Business Web. Log in with the email you were given.</div></div>`;
}
function forgotScreen(){
  return `<div class="card"><h2>Reset your password</h2><p class="sub">Type your email address and we will send you a link.</p>
  ${authMsg?`<div class="banner bad">${authMsg}</div>`:""}
  <label for="uid">Email address</label><input id="uid" type="email" autocomplete="username">
  <button class="btn" data-a="sendreset">Send reset link</button>
  <button class="btn ghost" data-a="tologin">Back to log in</button></div>`;
}
function resetScreen(){
  return `<div class="card"><h2>Choose a new password</h2>
  ${authMsg?`<div class="banner bad">${authMsg}</div>`:""}
  <label for="pw">New password</label><input id="pw" type="password" autocomplete="new-password">

function areaScreen(){
  const q={cust:"Where should we deliver?",own:"Which area is your shop in?",adm:"Choose an area to look at"}[user.tab];
  return `<h1>${q}</h1><p class="sub">Pick your area in Inanda.</p><div class="areas">${AREAS.map(a=>`<button data-a="loc" data-v="${a}">${a}</button>`).join("")}</div>`;
}
function render(){
  document.getElementById("bar").innerHTML = user?`<span><b>${ROLES[user.tab]}</b>${loc?" · "+loc:""}</span><span>${loc?'<button class="sm" data-a="area">Change area</button> ':''}<button class="sm" data-a="logout">Log out</button></span>`:"";
  document.getElementById("demo").style.display = user&&loc?"flex":"none";
  document.getElementById("app").innerHTML = !user?(authView==="forgot"?forgotScreen():authView==="reset"?resetScreen():loginScreen()):!loc?areaScreen():tab==="cust"?customer():tab==="own"?owner():admin();
}
document.body.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a, id=+el.dataset.id, o=S.orders.find(x=>x.id===id);
  if(a==="tab"){tab=el.dataset.v; ownView="due";}
  else if(a==="reset") init();
  else if(a==="role") loginRole=el.dataset.v;
  else if(a==="login"){doLogin();}
  else if(a==="signup"){doSignup();}
  else if(a==="forgot"){authView="forgot"; authMsg="";}
  else if(a==="tologin"){authView="login"; authMsg="";}
  else if(a==="sendreset"){doRecover();}
  else if(a==="setpw"){doSetPw();}
  else if(a==="logout"){user=null; loc=null; sess=null; BANK=null; localStorage.removeItem("inanda_sess");}
  else if(a==="area") loc=null;
  else if(a==="loc") loc=el.dataset.v;
  else if(a==="d2"){S.late=true;S.day=2;}
  else if(a==="late"){S.late=true;S.day=4; if(dueNow()>0&&!S.pay) S.paused=true;}
  else if(a==="stmt") ownView="stmt";
  else if(a==="inc") S.cart[id]=(S.cart[id]||0)+1;
  else if(a==="dec") S.cart[id]=Math.max(0,(S.cart[id]||0)-1);
  else if(a==="order"){ const lines=S.items.filter(i=>S.cart[i.id]).map(i=>({n:i.name,q:S.cart[i.id],s:i.shop,o:online(i.shop)}));
    if(lines.length&&!S.paused){S.orders.push({id:S.nextId++,lines,status:"placed",settled:false}); S.cart={};} }
  else if(a==="accept") o.status="accepted";
  else if(a==="deliver") o.status="delivered";
  else if(a==="cancel") cancelling=id;
  else if(a==="docancel"){o.status="cancelled"; o.reason=document.getElementById("why").value; cancelling=null;}
  else if(a==="pay") ownView="pay";
  else if(a==="back") ownView="due";
  else if(a==="paid"){S.pay={amount:dueNow(),ids:unpaid().map(x=>x.id),m:S.late?"OCT":"SEP"}; ownView="due";}
  else if(a==="confirm"){ S.orders.forEach(x=>{if(S.pay.ids.includes(x.id)) x.settled=true;}); S.paidTotal+=S.pay.amount; S.pay=null; S.paused=false; S.late=false; S.day=0; }
  render();
});
document.body.addEventListener("change",e=>{
  if(e.target.dataset.a==="bank"){const k=e.target.dataset.k,v=e.target.value; if(BANK){BANK[k]=v; saveBank(k,v);}}
  if(e.target.dataset.a==="price"){const i=S.items.find(x=>x.id===+e.target.dataset.id); const v=parseFloat(e.target.value); if(v>0) i.shop=v; render();}
});
init(); document.getElementById("logo").innerHTML=LOGO; render(); restore();

// ---- PWA: install button and service worker ----
let deferred = null;
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
function installUI(){
  const el = document.getElementById("install");
  if(standalone) { el.innerHTML = ""; return; }
  if(deferred) el.innerHTML = '<div class="card"><b>Install Inanda Business Web</b><p class="sub" style="margin:4px 0 0">Add it to your phone or computer for quick access.</p><button class="btn" id="inst">Install app</button></div>';
  else if(isIOS) el.innerHTML = '<div class="note" style="margin:0 0 14px">To install: tap the Share button, then "Add to Home Screen".</div>';
  else el.innerHTML = "";
  const b = document.getElementById("inst");
  if(b) b.onclick = async () => { deferred.prompt(); await deferred.userChoice; deferred = null; installUI(); };
}
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; installUI(); });
addEventListener("appinstalled", () => { deferred = null; installUI(); });
installUI();
if("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
